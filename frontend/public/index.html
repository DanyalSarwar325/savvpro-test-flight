<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlightHub - Flight Listings</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">
        <i class="fas fa-plane"></i> FlightHub
      </div>
      <ul class="nav-links">
        <li><a href="/" class="active">Flights</a></li>
        <li><a href="/search">Search</a></li>
        <li><a href="/bookings">My Bookings</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1><i class="fas fa-list"></i> Available Flights</h1>
      <p>Explore and book your next flight</p>
    </div>

    <div id="loading" class="loading">
      <i class="fas fa-spinner fa-spin"></i> Loading flights...
    </div>

    <div id="error" class="alert alert-error" style="display: none;"></div>

    <div id="flights-container" class="flights-grid-compact">
      <!-- Flights will be inserted here -->
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    async function loadFlights() {
      try {
        const response = await fetch(`${API_BASE}/flights`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const flights = await response.json();
        console.log('Fetched flights:', flights);
        displayFlights(flights);
      } catch (error) {
        showError('Failed to load flights: ' + error.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function displayFlights(flights) {
      const container = document.getElementById('flights-container');
      
      if (!flights || flights.length === 0) {
        container.innerHTML = '<p class="empty-message">No flights available</p>';
        return;
      }

      container.innerHTML = flights.map(flight => {
        const depDate = new Date(flight.departure_time);
        const dateStr = depDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const timeStr = depDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const imageUrl = `https://picsum.photos/seed/flighthub-${flight.id}/800/500`;
        
        return `
        <div class="flight-card-compact">
          <div class="flight-image-wrap">
            <img src="${imageUrl}" alt="${flight.origin} to ${flight.destination}" class="flight-image">
            <div class="flight-image-badge">
              <span class="flight-number-compact">${flight.flight_number}</span>
              <span class="seat-status ${flight.seats_available > 0 ? 'available' : 'full'}">
                <i class="fas fa-${flight.seats_available > 0 ? 'check-circle' : 'ban'}"></i>
                ${flight.seats_available > 0 ? flight.seats_available + ' seats' : 'Full'}
              </span>
            </div>
          </div>

          <div class="flight-body-compact">
            <div class="flight-route-main">
              <span class="airport-code">${flight.origin.substring(0, 3).toUpperCase()}</span>
              <span class="route-arrow"><i class="fas fa-arrow-right"></i></span>
              <span class="airport-code">${flight.destination.substring(0, 3).toUpperCase()}</span>
            </div>
            <div class="route-full">${flight.origin} → ${flight.destination}</div>

            <div class="flight-meta-compact">
              <div class="meta-item">
                <i class="fas fa-calendar-alt"></i>
                <span>${dateStr}</span>
              </div>
              <div class="meta-item">
                <i class="fas fa-clock"></i>
                <span>${timeStr}</span>
              </div>
              <div class="meta-item">
                <i class="fas fa-hourglass-end"></i>
                <span>${flight.duration_minutes} min</span>
              </div>
              <div class="meta-item">
                <i class="fas fa-plane-departure"></i>
                <span>${flight.total_seats} cap.</span>
              </div>
            </div>

            <div class="price-row-compact">
              <div>
                <div class="price-label">Price</div>
                <div class="price-tag-compact">$${flight.price.toFixed(2)}</div>
              </div>
              <div class="flight-action-compact">
                ${flight.seats_available > 0 
                  ? `<a href="/book/${flight.id}" class="book-btn">
                       <i class="fas fa-ticket-alt"></i> Book Now
                     </a>`
                  : `<button class="book-btn disabled">
                       <i class="fas fa-ban"></i> Sold Out
                     </button>`
                }
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    // Load flights on page load
    document.addEventListener('DOMContentLoaded', loadFlights);
  </script>
</body>
</html>
