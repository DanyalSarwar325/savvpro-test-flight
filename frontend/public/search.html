<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlightHub - Search Flights</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">
        <i class="fas fa-plane"></i> FlightHub
      </div>
      <ul class="nav-links">
        <li><a href="/">Flights</a></li>
        <li><a href="/search" class="active">Search</a></li>
        <li><a href="/bookings">My Bookings</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1><i class="fas fa-search"></i> Search Flights</h1>
      <p>Find the perfect flight for your journey</p>
    </div>

    <div class="search-panel">
      <form id="search-form" class="search-form">
        <div class="form-group">
          <label for="origin">
            <i class="fas fa-map-marker-alt"></i> Origin
          </label>
          <input 
            type="text" 
            id="origin" 
            name="origin" 
            placeholder="e.g., Karachi, Lahore..."
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="destination">
            <i class="fas fa-map-marker-alt"></i> Destination
          </label>
          <input 
            type="text" 
            id="destination" 
            name="destination" 
            placeholder="e.g., London, Dubai..."
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="date">
            <i class="fas fa-calendar-alt"></i> Departure Date
          </label>
          <input 
            type="date" 
            id="date" 
            name="date"
            class="form-input"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-large">
          <i class="fas fa-search"></i> Search Flights
        </button>
      </form>
    </div>

    <div id="error" class="alert alert-error" style="display: none;"></div>
    <div id="loading" class="loading" style="display: none;">
      <i class="fas fa-spinner fa-spin"></i> Searching...
    </div>

    <div id="results-container" class="flights-grid">
      <!-- Search results will be inserted here -->
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    const form = document.getElementById('search-form');
    const resultsContainer = document.getElementById('results-container');
    const loadingDiv = document.getElementById('loading');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const origin = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      const date = document.getElementById('date').value;

      if (!origin && !destination && !date) {
        showError('Please enter at least one search criteria');
        return;
      }

      await searchFlights(origin, destination, date);
    });

    async function searchFlights(origin, destination, date) {
      loadingDiv.style.display = 'block';
      errorDiv.style.display = 'none';
      resultsContainer.innerHTML = '';

      try {
        const params = new URLSearchParams();
        if (origin) params.append('origin', origin);
        if (destination) params.append('destination', destination);
        if (date) params.append('date', date);

        const response = await fetch(`${API_BASE}/flights/search?${params}`);
        const data = await response.json();

        if (!response.ok) {
          showError(data.detail || 'No flights found matching your criteria');
          return;
        }

        displayResults(data);
      } catch (error) {
        showError('Error searching flights: ' + error.message);
      } finally {
        loadingDiv.style.display = 'none';
      }
    }

    function displayResults(flights) {
      if (!flights || flights.length === 0) {
        resultsContainer.innerHTML = '<p class="empty-message">No flights found</p>';
        return;
      }

      resultsContainer.innerHTML = flights.map(flight => `
        <div class="flight-card">
          <div class="flight-header">
            <div class="flight-number">${flight.flight_number}</div>
            <div class="price-tag">$${flight.price.toFixed(2)}</div>
          </div>
          
          <div class="flight-route">
            <div class="city">
              <div class="code">${flight.origin.substring(0, 3).toUpperCase()}</div>
              <div class="name">${flight.origin}</div>
            </div>
            <div class="arrow">
              <i class="fas fa-arrow-right"></i>
            </div>
            <div class="city">
              <div class="code">${flight.destination.substring(0, 3).toUpperCase()}</div>
              <div class="name">${flight.destination}</div>
            </div>
          </div>

          <div class="flight-details">
            <div class="detail">
              <i class="fas fa-clock"></i>
              <span>${new Date(flight.departure_time).toLocaleString()}</span>
            </div>
            <div class="detail">
              <i class="fas fa-hourglass-end"></i>
              <span>${flight.duration_minutes} min</span>
            </div>
            <div class="detail">
              <i class="fas fa-chair"></i>
              <span>${flight.seats_available} seats</span>
            </div>
          </div>

          <div class="flight-footer">
            ${flight.seats_available > 0 
              ? `<a href="/book/${flight.id}" class="btn btn-primary">
                   <i class="fas fa-plus"></i> Book Now
                 </a>`
              : `<button class="btn btn-disabled">
                   <i class="fas fa-ban"></i> Sold Out
                 </button>`
            }
          </div>
        </div>
      `).join('');
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
